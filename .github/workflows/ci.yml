name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "37 3 * * *" # nightly: fuzzing

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: go vet
        run: go vet ./...
      - name: go test
        shell: bash
        run: |
          set -o pipefail
          go test ./... 2>&1 | tee test.log || {
            # Surface the failures as annotations, readable without the logs.
            grep -E -- '--- FAIL|_test\.go:[0-9]+:|^FAIL|panic:' test.log | head -40 | sed 's/^/::error::/'
            exit 1
          }
      - name: pii throughput floor
        if: runner.os == 'Linux'
        shell: bash
        run: LOCKKIT_PII_FLOOR_MBPS=2.5 GOMAXPROCS=1 go test -run '^TestSecretThroughputFloor$' -count=1 -v ./pii/ | grep -E 'MB/s|^(ok|FAIL|---)'
      - name: windows build
        if: matrix.os == 'ubuntu-latest'
        run: GOOS=windows go vet ./...

  windows:
    name: test audit (windows-latest)
    # The audit log's file lock (LockFileEx) only runs on Windows.
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: go test ./audit
        run: go test ./audit

  lint:
    name: lint (staticcheck, govulncheck)
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.1 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      # Short on pull requests (the targets must keep building and not
      # panic on their corpus), longer at night.
      FUZZTIME: ${{ github.event_name == 'schedule' && '60s' || '10s' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.x"
          check-latest: true
      - name: fuzz targets
        run: |
          set -e
          while read -r target pkg; do
            [ -n "$target" ] || continue
            echo "== $target ($pkg)"
            go test -run '^$' -fuzz "^${target}\$" -fuzztime "$FUZZTIME" "$pkg"
          done < .github/fuzz-targets
