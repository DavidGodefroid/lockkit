name: docs-dispatch

# lockfamily.dev/docs is built by lockfamily's docs-site/build.py from this
# repository's README.md, CHANGELOG.md, GUIDE.md and docs/**. Its pages
# workflow rebuilds nightly; this dispatch makes a change to those files, or
# a release, show on the site within minutes.
#
# LOCKFAMILY_DOCS_TOKEN: a fine-grained token limited to
# DavidGodefroid/lockfamily, Contents read and write (lockfamily#39). Without
# it the job passes with a notice and the nightly build picks the change up.

on:
  push:
    branches: [main]
    paths:
      - README.md
      - CHANGELOG.md
      - GUIDE.md
      - "docs/**"
  release:
    types: [published]

permissions: {}

jobs:
  dispatch:
    name: dispatch docs to lockfamily
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: send repository_dispatch (docs)
        env:
          GH_TOKEN: ${{ secrets.LOCKFAMILY_DOCS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "::notice::LOCKFAMILY_DOCS_TOKEN not set"; exit 0; fi
          gh api repos/DavidGodefroid/lockfamily/dispatches -f event_type=docs
